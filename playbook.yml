---
- name: Deploy Ntfy With Caddy
  hosts: all
  become: true

  vars:
    domain: ntfy.example.com

  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Set ufw Default Deny Incoming
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Allow Firewall Rules
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Update And Upgrade All Packages
      ansible.builtin.apt:
        autoclean: true
        autoremove: true
        update_cache: true
        upgrade: safe

    - name: Install Unattended-Upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Configure APT Periodic Updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Configure Unattended-Upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
              "${distro_id}:${distro_codename}-updates";
          };

          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";

          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
          Unattended-Upgrade::Automatic-Reboot-Time "03:00";

    - name: Enable Unattended-Upgrades Service
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started

    - name: Add ntfy APT Repository
      ansible.builtin.deb822_repository:
        name: ntfy
        uris: https://archive.ntfy.sh/apt
        suites: stable
        components: main
        architectures: amd64
        signed_by: https://archive.ntfy.sh/apt/keyring.gpg

    - name: Install ntfy
      ansible.builtin.apt:
        name: ntfy
        state: present

    - name: Deploy ntfy Server Configuration
      ansible.builtin.template:
        src: server.yml.j2
        dest: /etc/ntfy/server.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart Ntfy

    - name: Enable ntfy Service
      ansible.builtin.systemd:
        name: ntfy
        enabled: true
        state: started

    - name: Add Caddy APT Repository
      ansible.builtin.deb822_repository:
        name: caddy-stable
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites: any-version
        components: main
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key

    - name: Install Caddy Server
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Deploy Caddy Configuration
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: caddy
        group: caddy
        mode: "0644"
      notify: Reload Caddy

    - name: Enable Caddy Service
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started

  handlers:
    - name: Restart Ntfy
      ansible.builtin.systemd:
        name: ntfy
        state: restarted

    - name: Reload Caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
